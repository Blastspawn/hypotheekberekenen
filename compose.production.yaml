services:
  hypotheekberekenen:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hypotheekberekenen
    restart: unless-stopped
    expose:
      - "3002"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - web-network

networks:
  web-network:
    external: true
